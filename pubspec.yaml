name: atmosphere_weather
description: "A feature-rich Flutter Weather application with AI Insights, Home Screen Widgets, AdMob monetization, offline caching, multi-language support, and GitHub Actions CI/CD for release APKs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3
  geolocator: ^11.0.0
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.1.2
  fl_chart: ^0.68.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  screenshot: ^3.0.0
  share_plus: ^10.0.0
  google_mobile_ads: ^5.1.0
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
