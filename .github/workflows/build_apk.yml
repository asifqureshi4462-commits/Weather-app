name: Build & Release Flutter Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inject .env File from GitHub Secrets
        run: |
          echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" > .env
          echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> .env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          echo "ADMOB_BANNER_UNIT_ID=${{ secrets.ADMOB_BANNER_UNIT_ID }}" >> .env
          echo "ADMOB_INTERSTITIAL_UNIT_ID=${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}" >> .env
          echo "Created .env configuration with GitHub Secrets."

      - name: Repair & Generate Android Flutter v2 Embedding Project
        run: |
          echo "Generating clean Android project structure with Flutter v2 embedding..."
          flutter create --platforms=android --org com.example --project-name atmosphere_weather .

          # -----------------------------------------------------------------
          # Force AGP's legacy DSL / legacy Kotlin plugin compatibility mode.
          # AGP 9.0+ introduced a new DSL that many third-party plugins
          # (including google_mobile_ads) have not yet migrated to, causing
          # errors like "Could not get unknown property 'all' for
          # configuration container ... of type DefaultConfigurationContainer".
          # This is Flutter's own documented mitigation:
          # https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
          # -----------------------------------------------------------------
          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            grep -q "android.newDsl" "$GRADLE_PROPS" || echo "android.newDsl=false" >> "$GRADLE_PROPS"
            grep -q "android.builtInKotlin" "$GRADLE_PROPS" || echo "android.builtInKotlin=false" >> "$GRADLE_PROPS"
            echo "Forced legacy AGP DSL compatibility mode in $GRADLE_PROPS."
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "Injecting permissions and AdMob metadata into AndroidManifest.xml..."

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi

          if ! grep -q "flutterEmbedding" "$MANIFEST"; then
            sed -i 's|</application>|        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>|' "$MANIFEST"
          fi

          ADMOB_ID="${{ secrets.ADMOB_APP_ID }}"
          if [ -z "$ADMOB_ID" ]; then
            ADMOB_ID="ca-app-pub-3940256099942544~3347511713"
          fi
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i "s|</application>|        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_ID\" />\n    </application>|" "$MANIFEST"
          else
            sed -i "s/ADMOB_APP_ID_PLACEHOLDER/$ADMOB_ID/g" "$MANIFEST" || true
          fi

          MAIN_KT_DIR="android/app/src/main/kotlin/com/example/atmosphere_weather"
          mkdir -p "$MAIN_KT_DIR"
          printf 'package com.example.atmosphere_weather\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {\n}\n' > "$MAIN_KT_DIR/MainActivity.kt"
          find android/ -name "MainActivity.java" -delete 2>/dev/null || true

          if [ -f "android/app/build.gradle" ]; then
            echo "Enabling core library desugaring in android/app/build.gradle..."
            if ! grep -q "coreLibraryDesugaringEnabled" android/app/build.gradle; then
              sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' android/app/build.gradle
            fi
            if ! grep -q "desugar_jdk_libs" android/app/build.gradle; then
              if grep -q "dependencies {" android/app/build.gradle; then
                sed -i 's/dependencies {/dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"/' android/app/build.gradle
              else
                printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n' >> android/app/build.gradle
              fi
            fi
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Enabling core library desugaring in android/app/build.gradle.kts..."
            if ! grep -q "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts; then
              sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
            fi
            if ! grep -q "desugar_jdk_libs" android/app/build.gradle.kts; then
              if grep -q "dependencies {" android/app/build.gradle.kts; then
                sed -i 's/dependencies {/dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")/' android/app/build.gradle.kts
              else
                printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n' >> android/app/build.gradle.kts
              fi
            fi
          fi

          echo "Flutter Android v2 embedding & desugaring setup generated."

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Generate Native Splash Screen
        run: flutter pub run flutter_native_splash:create || true

      - name: FIX - Patch google_mobile_ads build.gradle for Gradle Compatibility
        run: |
          echo "=== Patching google_mobile_ads build.gradle if needed ==="
          GRADLE_FILES=$(find "$HOME/.pub-cache/hosted/pub.dev" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | grep "google_mobile_ads" || true)
          if [ -n "$GRADLE_FILES" ]; then
            for FILE in $GRADLE_FILES; do
              echo "Processing $FILE..."
              sed -i 's/for\s*(configuration\s*in\s*configurations)/for (configuration in configurations.matching { it.name != "archives" })/g' "$FILE" 2>/dev/null || true
              # Handle "configurations.all { ... }" (same line)
              sed -i 's/configurations\.all\s*{/configurations.configureEach {/g' "$FILE" 2>/dev/null || true
              # Handle "configurations.all" possibly split across a line break
              # before the opening brace (perl -0777 = treat whole file as one string).
              perl -0777 -pi -e 's/configurations\.all(\s*)\{/configurations.configureEach$1\{/g' "$FILE" 2>/dev/null || true
              echo "Safely processed $FILE"
            done
          else
            echo "No google_mobile_ads gradle file required patching."
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atmosphere-Weather-v1.0.${{ github.run_number }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## Atmosphere Weather Android APK Release
            - Automated GitHub Actions build for run #${{ github.run_number }}
            - Features: Home Screen Weather Widgets, AI Vibe Summaries, AdMob Monetization, Multi-Language, Offline Caching
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
