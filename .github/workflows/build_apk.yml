name: Build & Release Flutter Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inject .env File from GitHub Secrets
        run: |
          echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" > .env
          echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> .env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          echo "ADMOB_BANNER_UNIT_ID=${{ secrets.ADMOB_BANNER_UNIT_ID }}" >> .env
          echo "ADMOB_INTERSTITIAL_UNIT_ID=${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}" >> .env
          echo "Created .env configuration with GitHub Secrets."

      - name: Inject AdMob App ID into AndroidManifest.xml
        run: |
          ADMOB_ID="${{ secrets.ADMOB_APP_ID }}"
          if [ -z "$ADMOB_ID" ]; then
            ADMOB_ID="ca-app-pub-3940256099942544~3347511713"
          fi
          sed -i "s/ADMOB_APP_ID_PLACEHOLDER/$ADMOB_ID/g" android/app/src/main/AndroidManifest.xml || true
          echo "Successfully injected AdMob App ID into AndroidManifest.xml"

      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure Flutter v2 Embedding in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "flutterEmbedding" "$MANIFEST"; then
              echo "Injecting Android v2 embedding metadata into AndroidManifest.xml..."
              sed -i '/<activity/a \            <meta-data android:name="flutterEmbedding" android:value="2" \/>' "$MANIFEST"
            fi
          fi

      - name: Build Release APK
        run: flutter build apk --release: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atmosphere-Weather-v1.0.${{ github.run_number }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Atmosphere Weather APK Release v1.0.${{ github.run_number }}
          body: |
            ## Atmosphere Weather Android APK Release
            - Built with google_mobile_ads ^9.0.0 & Flutter Stable SDK
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
